<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Matrubhoomi Farms &amp; Developers">
  <title>Matrubhoomi Farms &amp; Developers</title>
  <!--
    A flat, single-weight reading of the company mark, for UI at 24-64px.
    The full illustrated logo does not survive that size: its brick texture,
    hard hat and shrimp become noise below about 96px. What carries the
    identity at small sizes is the SILHOUETTE - a ring, an MB monogram, a
    leaf and water - so that is all this draws.

    Colours are literals rather than tokens on purpose: this file is also
    fetched by PDF generators and email clients, where no CSS variable
    resolves.
  -->
  <defs>
    <clipPath id="mb-ring-clip">
      <circle cx="64" cy="64" r="56" />
    </clipPath>
  </defs>

  <!-- Ring: the enclosing gear of the original, reduced to one even stroke. -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#1F6B33" stroke-width="7" />

  <!-- Water, filling the lower third the way the wave does in the mark. -->
  <g clip-path="url(#mb-ring-clip)">
    <path
      d="M8 92c10-7 18-7 28 0s18 7 28 0 18-7 28 0 18 7 28 0v44H8z"
      fill="#2C7DA0"
      opacity="0.9"
    />
  </g>

  <!-- MB monogram. M in brick, B in field green - the two halves of the name. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <path d="M38 82V46l13 17 13-17v36" stroke="#A9522F" />
    <path d="M74 46h11a9 9 0 0 1 0 18H74m0 0h13a9 9 0 0 1 0 18H74V46" stroke="#1F6B33" />
  </g>

  <!-- Leaf, at the shoulder where the original puts its foliage. -->
  <path
    d="M92 30c9-2 15 1 16 2 1 1-1 8-8 12s-13 1-14 0 -3-12 6-14z"
    fill="#2E8B3F"
  />
</svg>
