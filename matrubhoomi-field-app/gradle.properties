# ── The API this app talks to ───────────────────────────────────────────
# Change the address HERE and rebuild — no source edit needed:
#
#   apiUrl=http://192.168.1.9:5000
#
# A -PapiUrl on the command line still overrides it, and the app itself has a
# "Server address" field on the sign-in screen that overrides both at runtime,
# so a phone already in somebody's hand can be pointed at a new laptop without
# a rebuild at all.
apiUrl=http://10.99.21.18:5000
