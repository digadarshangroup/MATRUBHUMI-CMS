org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── The API this app talks to ───────────────────────────────────────────
# The company's hosted backend. For a laptop on the same Wi-Fi instead,
# change it here and rebuild — no source edit needed:
#
#   apiUrl=http://192.168.1.9:5000
#
# A -PapiUrl on the command line still overrides it, and the app itself has a
# "Server address" field on the sign-in screen that overrides both at runtime,
# so a phone already in somebody's hand can be pointed elsewhere without a
# rebuild at all.
apiUrl=https://backend.matrubhumi.net
